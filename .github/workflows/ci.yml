name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Stdlib only, so no install step - unittest ships with the interpreter. Each of
      # these fixes a rule CLAUDE.md documents as having been wrong at least once already.
      - name: Run ingest/enrich unit tests
        run: python -m unittest discover -s tests

      # The description generator and this audit share checks.py. Running it here is what
      # stops the two standards drifting apart again.
      - name: Audit generated descriptions
        run: python -m scripts.enrich.audit

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
