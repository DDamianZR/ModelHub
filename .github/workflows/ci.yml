name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # 22.18 is the floor: below it Node cannot run the TypeScript tests without a build
      # step, and the point of node:test here is to have no test toolchain to maintain.
      - uses: actions/setup-node@v7
        with:
          node-version: ">=22.18"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The description generator and this audit share checks.py. Running it here is what
      # stops the two standards drifting apart again.
      - name: Audit generated descriptions
        run: python -m scripts.enrich.audit

      # Stdlib unittest, no runner to install: the ingest has no dependencies and its tests
      # keep that property.
      - name: Ingest tests
        run: python -m unittest discover -s scripts/tests -t .

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
