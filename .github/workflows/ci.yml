name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Stdlib only, so no install step - unittest ships with the interpreter. Each of
      # these fixes a rule the project notes document as having been wrong at least once already.
      - name: Run ingest/enrich unit tests
        run: python -m unittest discover -s tests

      # The description generator and this audit share checks.py. Running it here is what
      # stops the two standards drifting apart again.
      - name: Audit generated descriptions
        run: python -m scripts.enrich.audit

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # A token pairing below 3:1 fails the build rather than being found later.
      # Same principle as the enrich audit above: a check that only runs during
      # the post-mortem is not a check.
      - name: Verify token contrast
        run: npm run check:contrast

      # The radius scale is a strict arithmetic progression (outer - inset = inner);
      # this catches a hand-tuned value that breaks it before it ships.
      - name: Verify concentric radius progression
        run: npm run check:geometry

      - run: npm run build

      # Reads the prerendered output, so it has to follow the build. Guards payload
      # size, dead tokens, locale parity and the accessibility floor — every figure
      # the UX work committed to, measured rather than asserted.
      - name: UX acceptance harness
        run: npm run check:ux
