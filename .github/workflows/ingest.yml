name: Daily ingest

# Layer A: deterministic, no LLM. Pulls the confirmed sources, recomputes the composite
# and commits /data. The commit is what triggers the Vercel redeploy, so the site stays
# current without anyone's machine being on.

on:
  schedule:
    # 06:17 UTC. Off the hour on purpose: scheduled jobs on the hour queue behind everyone
    # else's and get delayed.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Only one ingest at a time: two concurrent runs would race on the same commit.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No pip install step: the ingest is stdlib only, by design.
      - name: Run ingest
        run: python -m scripts.ingest.run

      - name: Report source health
        if: always()
        run: python scripts/ingest/report_status.py

      # config/vram.json is staged as well as /data, and that is not incidental. The run
      # recalibrates bytes_per_weight from every GGUF it has observed, and that table lives in
      # /config because it is a published input rather than derived output. Staging only /data
      # would regenerate it every night, leave the runner's tree dirty, and ship the very
      # first calibration forever while the log claimed a fresh one.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data config; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git add data config
          git commit -m "chore(data): daily ingest $(date -u +%Y-%m-%d)"
          git push
