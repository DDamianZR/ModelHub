name: Daily ingest

# Layer A: deterministic, no LLM. Pulls the confirmed sources, recomputes the composite
# and commits /data. The commit is what triggers the Vercel redeploy, so the site stays
# current without anyone's machine being on.

on:
  schedule:
    # 06:17 UTC. Off the hour on purpose: scheduled jobs on the hour queue behind everyone
    # else's and get delayed.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Only one ingest at a time: two concurrent runs would race on the same commit.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No pip install step: the ingest is stdlib only, by design.
      - name: Run ingest
        run: python -m scripts.ingest.run

      - name: Report source health
        if: always()
        run: python scripts/ingest/report_status.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git add data
          git commit -m "chore(data): daily ingest $(date -u +%Y-%m-%d)"
          git push

      # Runs after the commit on purpose: the site must update with today's data even
      # when a source is degraded. This step only turns a repeated failure into a red,
      # emailed workflow run - it never blocks the data from shipping.
      - name: Fail on a source stuck for 3+ runs
        if: always()
        run: python scripts/ingest/fail_stale.py

      # Today's score movement is exactly what can make a description's strength/weakness
      # claim stale - this is the run that moves the numbers underneath it. --warn always
      # exits 0: it surfaces drift the day it appears instead of a month later, but a
      # description going stale is not a reason to withhold today's data commit, which
      # has already happened by this point.
      - name: Check descriptions against today's scores
        if: always()
        run: python -m scripts.enrich.audit --warn
